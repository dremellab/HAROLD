# The working dir... output will be in the results subfolder of the workdir
workdir: "WORKDIR"

# temporary directory for intermediate files that are not saved
tempdir: "TEMP_DIR"

# tab delimited samples file ... should have the following 3 columns
# sampleName	groupName	path_to_R1_fastq	path_to_R2_fastq
samples: "WORKDIR/samples.tsv"

# select references .... host + viruses(comma-separated):
# select host: # options are hg38 or mm39
# host:       "hg38"
# additives:  "ERCC" # options are ERCC, BAC16Insert, and 4SU1
# viruses:    "NC_009333.1"
host: "HOST"
additives: "ADDITIVES"
viruses: "VIRUSES"
# select viruses and other (ERCC/BAC/4SU1): options are
# ERCC
# BAC16Insert
# 4SU1
#
# | RefSeq  Sequence | RefSeq assembly accession | Notes                                                 |
# | ---------------- | ------------------------- | ----------------------------------------------------- |
# | NC_007605.1      | GCF_002402265.1           | Human gammaherpesvirus 4 (Epstein-Barr virus)         |
# | NC_000898.1      | GCF_000846365.1           | Human betaherpesvirus 6B                              |
# | NC_001664.4      | GCF_000845685.2           | Human betaherpesvirus 6A                              |
# | NC_001716.2      | GCF_000848125.1           | Human betaherpesvirus 7                               |
# | NC_006273.2      | GCF_000845245.1           | Human betaherpesvirus 5                               |
# | NC_009333.1      | GCF_000838265.1           | Human gammaherpesvirus 8                              |
# | NC_045512.2      | GCF_009858895.2           | Severe acute respiratory syndrome-related coronavirus |
# | MN485971.1       | xx                        | HIV from Belgium ... GTF is hand curated              |
#
#   | RefSeq  Sequence | RefSeq assembly accession | Notes                                                        |
#   | ---------------- | ------------------------- | ------------------------------------------------------------ |
#   | NC_001806.2      | GCF_000859985.2           | [Human alphaherpesvirus 1 (Herpes simplex virus type 1)](https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&id=10298&lvl=3&lin=f&keep=1&srchmode=1&unlock) (strain 17) |
#
#  | RefSeq  Sequence | RefSeq assembly accession | Notes                                                        |
#  | ---------------- | ------------------------- | ------------------------------------------------------------ |
#  | KT899744.1       | KT899744.1                | HSV-1 strain KOS                                             |
#  | MH636806.1       | MH636806.1                | MHV68 (Murine herpesvirus 68 strain WUMS)                    |
#
## you most probably dont need to change these
scriptsdir: "PIPELINE_HOME/workflow/scripts"
resourcesdir: "PIPELINE_HOME/resources"
fastas_gtfs_dir: "REFS_DIR"
trnas_gtf:
  hg38: "REFS_DIR/hg38.tRNAs.hg38chroms.gtf"
  mm39: "REFS_DIR/mm39.tRNAs.mm39chroms.gtf"
chrr_gtf:
  hg38: "REFS_DIR/hg38.chrR.gtf"
  mm39: "REFS_DIR/mm39.chrR.gtf"
include_trnas_gtf_in_ref: true # when true, append trnas_gtf[host] to GTFS before building ref.gtf

# strand inference
# Legacy configs used `infer_strandedness`; newer HAROLD expects
# `use_infer_strandedness` and the `strandedness_column`/threshold keys below.
use_infer_strandedness: true
infer_strandedness_threshold: 0.8
strandedness_column: "strandedness"

# Cutadapt parameters
cutadapt_min_length: 15
cutadapt_n: 5
cutadapt_max_n: 0.5
cutadapt_O: 5
cutadapt_q: 20

# kraken2 db
kraken2_db: "/project/dremel_lab/workflows/reference_data/kraken2/kraken2_db"
kraken2_params: "--use-names --gzip-compressed --quick"

# STAR parameters
star_save_transcript_sam: false
star_alignTranscriptsPerReadNmax: 30000
star_flanksize: 15

# deepTools parameters
deeptools_normalize: "CPM"
deeptools_binSize: 10

# ERCC / batch-correction / gene-selection settings shared by both the aggregate
# normalized-counts step and the per-contrast DEG/GSEA step below, so the two
# always agree on how the counts matrix was normalized.
# Older YAMLs with nested `diffex_normalized_counts.*` or `diffex_deg_gsea.*`
# DiffEx settings should be migrated to this top-level `diffex:` block.
diffex:
  use_ercc: false # false, true, or both ... "both" runs normalization with and without ERCC scaling
  ercc_mix: 1 # which ERCC mix was used ... 1 or 2
  use_batch: false # false, true, or both ... "both" runs normalization with and without batch correction
  batch_column: "batch" # if use_batch is true/both, which column in samples.tsv has the batch info
  genes_selection: "both" # host virus or both ... recommend both

# generate diffex normalized counts (aggregate, across the whole sample set)
diffex_normalized_counts:
  run: true # true or false

# run DEG (limma/DESeq2/edgeR) and GSEA per contrast via the diffex container
diffex_deg_gsea:
  run: false # true or false ... requires contrasts.tsv (see "contrasts" below)
  contrasts: "WORKDIR/contrasts.tsv" # tab-delimited, columns: group1  group2
  log2fc_threshold: 1.0
  pvalue_threshold: 0.05
  fdr_threshold: 0.05
  edger_cpm_cutoff: 0.1
  edger_cpm_group_fraction: 0.5
  deseq2_low_count_cutoff: 2
  deseq2_low_count_group_fraction: 0.5
  gsea_min_gs_size: 15
  gsea_max_gs_size: 500
  gsea_pvalue_cutoff: 0.05

# list out all containers to be used
containers:
  base: "docker://nciccbr/ccbr_ubuntu_base_20.04:v7"
  bedToBigBed: "docker://seqinfomics/bedtobigbed:latest"
  bowtie1: "docker://nciccbr/charlie_bowtie1:v0.1.1"
  circexplorer: "docker://nciccbr/ccbr_circexplorer:v1.0"
  circRNA_finder: "docker://nciccbr/charlie_circrna_finder:v1.0.1"
  ciri: "docker://nciccbr/charlie_ciri2:v1.0.1"
  clear: "docker://nciccbr/ccbr_clear:v2.0.1"
  cutadapt: "docker://nciccbr/charlie_cutadapt_fqfilter:v1.0.1"
  deeptools: "docker://stjudecloud/deeptools:1.0.1"
  dcc: "docker://nciccbr/charlie_dcc:v0.2.1"
  diffex: "docker://seqinfomics/diffex:0.5.7"
  # diffex: "docker://ghcr.io/dremellab/diffex:0.5.2"
  fastqvalidator: "docker://seqinfomics/fastqvalidator:0.1.1a"
  fastqc: "docker://nciccbr/ccrgb_qctools:v4.0"
  gffread: "docker://zavolab/gffread:0.11.7"
  gtfToGenePred: "docker://seqinfomics/gtftogenepred:latest"
  genePredToBed: "docker://seqinfomics/genepredtobed:latest"
  kraken2: "docker://staphb/kraken2:2.1.3"
  mapsplice: "docker://cgrlab/mapsplice2:latest"
  multiqc: "docker://multiqc/multiqc:v1.28"
  picard: "docker://nciccbr/ccbr_picard_2.27.5:v1"
  py311: "docker://seqinfomics/py311:latest"
  pysam: "docker://seqinfomics/pysam:0.22.1"
  qualimap: "docker://stjudecloud/qualimap:1.0.3"
  R: "docker://nciccbr/ccbr_r_4.3.0:v1"
  rseqc: "docker://seqinfomics/rseqc:4.0.0"
  rustqc: "docker://seqinfomics/rustqc:0.2.1"
  samtools: "docker://staphb/samtools:1.21"
  star: "docker://nciccbr/ccbr_star_2.7.6a:latest"
  star_ucsc_cufflinks: "docker://nciccbr/charlie_star_ucsc_cufflinks:v0.4.1"
  aws: "docker://seqinfomics/aws:1.44.86"

# S3 Transfer Configuration (optional)
# Set push_to_s3: true to enable automatic S3 transfer at pipeline completion
push_to_s3: false
s3_pipeline_name: "HAROLD"                              # pipeline name for S3 path hierarchy

# AWS S3 transfer settings
s3_sample_set_name: ""                                  # required if push_to_s3=true
s3_aws_credentials_file: "/project/dremel_lab/scripts/aws/credentials"
s3_bucket: "dremel-lab-bucket"
s3_output_prefix: "_HTS"

# Storage classes: STANDARD, GLACIER_IR, GLACIER, INTELLIGENT_TIERING
s3_default_storage_class: "GLACIER_IR"                  # for most files
s3_large_file_storage_class: "GLACIER"                  # for .bam and .bai files
