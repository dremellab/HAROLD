# Snakemake v8+ profile for Rivanna (SLURM)
# "rivanna" profile

executor: slurm
jobs: 200

# singularity related settings
# --deployment-method apptainer
use-apptainer: true
# harold wrapper points to the shared /project/dremel_lab/workflows/singularity_images SIF directory by default.
apptainer-prefix: /project/dremel_lab/workflows/singularity_images
apptainer-args: --bind /project/dremel_lab:/project/dremel_lab --bind /standard/dremel_lab:/standard/dremel_lab --bind /sfs/gpfs/tardis/project/dremel_lab:/sfs/gpfs/tardis/project/dremel_lab --bind /sfs/ceph/standard/dremel_lab:/sfs/ceph/standard/dremel_lab --bind /sfs/weka/scratch:/sfs/weka/scratch --bind /scratch:/scratch

# debugging and verbosity
# --verbose
verbose: true # is true by default for plugin
# --printshellcmds
printshellcmds: true

# rerun settings
# --rerun-triggers input mtime software-env code
rerun-triggers: [mtime, input, code, software-env]
# --rerun-incomplete
rerun-incomplete: true # not parsed via plugin
# do not use --ignore-incomplete
ignore-incomplete: false # set true via plugin

# no parameters
# --notemp
notemp: true # logs of successful jobs are kept .. this is parsed correctly via plugin but logs are still deleted
# do not use --nolock
nolock: false # reset lock to default, plugin sets to true .. but this does not work it is still set to true by plugin
# do not use --no-hooks
no-hooks: false # reset hooks to default, plugin sets to true

# latency and speed related
# --latency-wait 300
latency-wait: 300
# --max-inventory-time 60
max-inventory-time: 60 # plugin parses this correctly as 0 .. trying to reset to default

# Logging settings
slurm-logdir: logs
slurm-keep-successful-logs: true
keep-going: true
restart-times: 3

# report: report.html

# these are not really working ... ignore
jobname: "{rule}.{wildcards}.{jobid}" # job-name errors out ... needs to be jobname
jobscript: config/rivanna/jobscript.sh

# --- Global defaults (from "__default__") ---
default-resources:
  threads: 2 # "__default__.threads"
  mem_mb: 40960 # "__default__.mem" = 40g -> 40*1024 = 40960 MB
  runtime: 240 # "__default__.time" = 4:00:00 -> 240 minutes
  slurm_partition: standard-rivanna
  slurm_ntasks: 1

# --- Per-rule overrides ---

set-threads:
  create_index: 8
  cutadapt: 16
  star_align_two_pass: 16
  sort_star: 8
  split_bam: 8
  bam_to_bigwig: 8
  qualimap: 8
  kraken2: 32
  mark_duplicates: 8
  rustqc_rna_combined_probe: 8
  rustqc_rna_combined: 8
  rustqc_rna_region: 4

set-resources:
  create_index:
    mem_mb: 122880 # 120 GB
    runtime: 480 # 8 hours

  fastq_validate_sample:
    mem_mb: 122880 # 120 GB -- matches cutadapt below, which processes the same
                 # FASTQ files. Default (40 GB) OOM-kills fastQValidator on
                 # large modern runs (observed: killed at ~40 GB validating a
                 # ~20-22 GB gzip R1/R2 pair); this rule runs unconditionally
                 # before cutadapt and blocks it on failure, so under-sizing
                 # this silently blocks the whole sample.
    runtime: 480 # 8 hours
    threads: 1   # single-threaded fastQValidator invocation; no benefit from more cores.

  cutadapt:
    mem_mb: 122880 # 120 GB
    runtime: 960 # 16 hours

  star_align_two_pass:
    mem_mb: 122880
    runtime: 480

  sort_star:
    mem_mb: 122880
    runtime: 480

  split_bam:
    mem_mb: 122880
    runtime: 480

  bam_to_bigwig:
    mem_mb: 122880
    runtime: 480

  qualimap:
    mem_mb: 122880
    runtime: 480

  rseqc_geneBody_coverage:
    runtime: 2880

  rseqc_fpkm:
    runtime: 720 # 12 hours -- per-attempt BASE runtime (minutes), not a flat cap -- the
                 # rule's own `resources:` block (workflow/rules/quantify.smk) multiplies
                 # this by Snakemake's `attempt` (1..4, since restart-times: 3 above), so
                 # retries get progressively more walltime instead of timing out
                 # identically 4x. Observed: FPKM_count.py over a full hg38 annotation
                 # (~230k+ transcripts) didn't finish within the global 4h default.

  mark_duplicates:
    mem_mb: 122880 # 120 GB -- Picard MarkDuplicates on a ~20GB/600M-read combined bam has no
                   # prior timing/memory data in this pipeline; sized generously (matching the
                   # tier used for other heavy full-genome rules like cutadapt/star_align_two_pass)
                   # pending a real benchmark run.
    runtime: 480 # 8 hours -- generous pending real benchmark data (see above).

  rustqc_rna_combined_probe:
    mem_mb: 122880
    runtime: 120 # 2 hours -- real headroom above the confirmed ~45min single full-pass baseline
                 # (2026-07-28 full-scale TIN benchmark, N_Mock_4h, 689M reads); this rule only
                 # ever runs when USE_INFER_STRANDEDNESS is true (see qc.smk), and is a full
                 # rustqc rna pass in its own right (dupRadar/featureCounts can't be excluded).

  rustqc_rna_combined:
    mem_mb: 122880
    runtime: 120 # 2 hours -- same basis as rustqc_rna_combined_probe above; this is the final,
                 # correctly-stranded pass whose outputs are the ones actually declared/consumed.

  rustqc_rna_region:
    mem_mb: 40960 # 40 GB -- per-region split bams are much smaller than the combined bam, but
                  # the full hg38 GTF parse cost is bam-size-independent (~5min minimum observed
                  # even on small viral-contig bams in validation testing).
    runtime: 120 # 2 hours

  kraken2:
    mem_mb: 245760
    threads: 32
    runtime: 720

  s3_transfer_if_enabled:
    mem_mb: 4096 # 4 GB (minimal, just AWS CLI)
    runtime: 480 # 8 hours (for large transfers)
    threads: 1

  # Initial estimates, not yet profiled against real production runs --
  # revisit once there's usage data from actual v2.0.0 runs.
  alignment_summary:
    mem_mb: 8192 # 8 GB -- streams reads via pysam into a small per-contig
                 # tally dict (not read-accumulating), so this is I/O/CPU-bound
                 # rather than memory-bound.
    runtime: 480 # 8 hours -- aggregates ALL samples' BAMs in a single
                 # sequential job (bam.fetch(until_eof=True) per sample), so
                 # runtime scales with total read depth across the whole
                 # sample set, unlike the per-sample alignment rules above.
    threads: 1   # single-threaded pysam iteration; no benefit from more cores.

  warm_msigdb_cache:
    mem_mb: 4096 # 4 GB -- lightweight R/msigdbr metadata fetch, not a
                 # compute-heavy step.
    runtime: 480 # 8 hours -- network-bound (MSigDB download); compute nodes
                 # may have slower/more restricted egress than login nodes.
                 # restart-times: 3 (set globally above) already retries
                 # transient network failures.
    threads: 1
