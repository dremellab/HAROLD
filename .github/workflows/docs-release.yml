name: Deploy Release Docs

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Patch _quarto.yml for release
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s|site-url: https://dremellab.github.io/HAROLD/dev/|site-url: https://dremellab.github.io/HAROLD/${VERSION}/|" _quarto.yml
          sed -i "s|version: \"dev\"|version: \"${VERSION}\"|" _quarto.yml
          sed -i "s|text: \"Version: dev\"|text: \"Version: ${VERSION}\"|" _quarto.yml

      - name: Render site
        run: quarto render

      - name: Deploy to versioned path
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.version.outputs.VERSION }}
          keep_files: true

      - name: Deploy to /latest/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: latest
          keep_files: true

      - name: Update root redirect to /latest/
        run: |
          mkdir -p _root
          cat > _root/index.html << 'EOF'
          <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
              <title>Redirect to latest docs</title>
              <meta http-equiv="refresh" content="0;URL='latest/'" />
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy root redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_root
          keep_files: true
