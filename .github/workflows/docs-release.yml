name: Deploy Release Docs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install PyYAML for config patching
        run: pip install PyYAML

      - name: Patch _quarto.yml for release
        run: |
          python3 - "${{ steps.version.outputs.VERSION }}" <<'PYTHON_SCRIPT'
          import yaml, sys

          version = sys.argv[1]
          base_url = "https://dremellab.github.io/HAROLD"

          with open('_quarto.yml', 'r') as f:
              config = yaml.safe_load(f)

          # Always set the correct site-url for the versioned deployment
          config['website']['site-url'] = f"{base_url}/{version}/"

          # Update version metadata
          if 'metadata' not in config:
              config['metadata'] = {}
          config['metadata']['version'] = version

          # Update navbar: set version text and mark this version "current" in the
          # menu, keeping every other entry (dev + prior releases) already committed
          # in _quarto.yml -- rather than replacing the whole menu with just
          # [this version, dev], which is all the previous version of this script
          # did (every versioned page only ever knew about itself + dev, never any
          # sibling releases). Self-healing: if this version isn't in the list yet
          # (the normal case -- the dev-docs entry for a new version is usually
          # added *after* the release build, per _quarto.yml's own instructions),
          # it's inserted rather than skipped.
          current_href = f'{base_url}/{version}/docs/index.html'
          navbar = config.get('website', {}).get('navbar', {})
          right_items = navbar.get('right', [])
          for item in right_items:
              if isinstance(item, dict) and 'menu' in item:
                  order = []
                  text_by_href = {}
                  for entry in item.get('menu', []):
                      href = entry['href']
                      text = entry['text'].replace(' (current)', '')
                      if href not in text_by_href:
                          order.append(href)
                      text_by_href[href] = text
                  text_by_href[current_href] = version
                  if current_href not in order:
                      order.append(current_href)

                  item['text'] = f"Version: {version}"
                  item['menu'] = [
                      {
                          'text': f'{version} (current)' if href == current_href else text_by_href[href],
                          'href': href,
                      }
                      for href in [current_href] + [h for h in order if h != current_href]
                  ]

          with open('_quarto.yml', 'w') as f:
              yaml.dump(config, f, default_flow_style=False)

          print(f"Patched _quarto.yml: site-url={config['website']['site-url']}, version={version}")
          PYTHON_SCRIPT

      - name: Render site
        run: quarto render

      - name: Deploy to versioned path
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.version.outputs.VERSION }}
          keep_files: true

      - name: Build /latest/ redirect to dev docs
        run: |
          mkdir -p _latest
          cat > _latest/index.html << 'EOF'
          <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
              <title>Redirect to dev docs</title>
              <meta http-equiv="refresh" content="0;URL='https://dremellab.github.io/HAROLD/dev/docs/index.html'" />
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy /latest/ redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_latest
          destination_dir: latest
          keep_files: true

      - name: Update root redirect to dev docs index
        run: |
          mkdir -p _root
          cat > _root/index.html << 'EOF'
          <html xmlns="http://www.w3.org/1999/xhtml">
            <head>
              <title>Redirect to dev docs</title>
              <meta http-equiv="refresh" content="0;URL='dev/docs/index.html'" />
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy root redirect
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_root
          keep_files: true
