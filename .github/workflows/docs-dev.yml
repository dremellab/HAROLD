name: Deploy Dev Docs

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - '_quarto.yml'
      - '*.md'
      - '*.qmd'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Deploy to gh-pages /dev/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: dev
          keep_files: true
