project:
  type: website
  output-dir: _site
  render:
    - docs/index.md
    - docs/prereq.md
    - docs/usage.md
    - docs/pipeline.qmd
    - docs/inputs.md
    - docs/outputs.md
    - docs/s3_configuration.md
    - docs/help.md
    - CHANGELOG.md

website:
  title: "HAROLD — RNA-seq Quantification & Normalization"
  site-url: https://dremellab.github.io/HAROLD/dev/
  repo-url: https://github.com/dremellab/HAROLD

  navbar:
    pinned: true
    right:
      - text: "Docs"
        href: docs/index.md
      # Version menu shown on the DEV docs site. This committed list is also the
      # source docs-release.yml's "Patch _quarto.yml for release" step starts from
      # when it builds a tagged release's own ephemeral copy -- it marks the
      # version being tagged as "(current)" (inserting it if not already present
      # here) and otherwise keeps every entry below as-is, so a versioned page
      # shows the same full history this list does at the time it's built. That
      # patch is never committed back to any branch, though, so THIS list (the one
      # the dev docs site actually renders) still needs a manual "{version}" entry
      # added below after every tagged release -- otherwise the dev docs dropdown
      # itself won't link to the new version (older already-built versioned pages
      # are frozen snapshots and can't pick up later additions either way).
      - text: "Version: dev"
        menu:
          - text: "dev (current)"
            href: https://dremellab.github.io/HAROLD/dev/docs/index.html
          - text: "2.1.0"
            href: https://dremellab.github.io/HAROLD/2.1.0/docs/index.html
          - text: "2.0.1"
            href: https://dremellab.github.io/HAROLD/2.0.1/docs/index.html
          - text: "2.0.0"
            href: https://dremellab.github.io/HAROLD/2.0.0/docs/index.html
          - text: "1.2.1"
            href: https://dremellab.github.io/HAROLD/1.2.1/docs/index.html
      - icon: github
        href: https://github.com/dremellab/HAROLD

  sidebar:
    style: floating
    collapse-level: 2
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - docs/index.md
          - docs/prereq.md
          - docs/usage.md
      - section: "Pipeline"
        contents:
          - docs/pipeline.qmd
          - docs/inputs.md
          - docs/outputs.md
      - section: "Cloud & Storage"
        contents:
          - docs/s3_configuration.md
      - section: "Help"
        contents:
          - docs/help.md

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    smooth-scroll: true
    mermaid:
      theme: default
    mermaid-format: js
    css: styles.css

metadata:
  version: "dev"
