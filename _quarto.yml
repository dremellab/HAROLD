project:
  type: website
  output-dir: _site

website:
  title: "HAROLD — RNA-seq Quantification & Normalization"
  site-url: https://dremellab.github.io/HAROLD/dev/
  repo-url: https://github.com/dremellab/HAROLD

  navbar:
    pinned: true
    right:
      - text: "Docs"
        href: docs/index.md
      # Version menu: automatically patched during release builds (docs-release.yml)
      # For dev docs, this shows dev as current; for release docs, it shows the release version as current
      # and links to dev. Do not manually edit the menu items below—they are auto-updated during releases.
      - text: "Version: dev"
        menu:
          - text: "dev (current)"
            href: https://dremellab.github.io/HAROLD/dev/
          - text: "1.2.1"
            href: https://dremellab.github.io/HAROLD/1.2.1/
      - icon: github
        href: https://github.com/dremellab/HAROLD

  sidebar:
    style: floating
    collapse-level: 2
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - docs/index.md
          - docs/prereq.md
          - docs/usage.md
      - section: "Pipeline"
        contents:
          - docs/pipeline.md
          - docs/inputs.md
          - docs/outputs.md
      - section: "Cloud & Storage"
        contents:
          - docs/s3_configuration.md
      - section: "Help"
        contents:
          - docs/help.md

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    smooth-scroll: true
    mermaid:
      theme: default

metadata:
  version: "dev"
