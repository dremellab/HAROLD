project:
  type: website
  output-dir: _site
  render:
    - docs/index.md
    - docs/prereq.md
    - docs/usage.md
    - docs/pipeline.qmd
    - docs/inputs.md
    - docs/outputs.md
    - docs/s3_configuration.md
    - docs/help.md
    - CHANGELOG.md

website:
  title: "HAROLD — RNA-seq Quantification & Normalization"
  site-url: https://dremellab.github.io/HAROLD/dev/
  repo-url: https://github.com/dremellab/HAROLD

  navbar:
    pinned: true
    right:
      - text: "Docs"
        href: docs/index.md
      # Version menu shown on the DEV docs site. docs-release.yml patches its own
      # ephemeral copy of this file during a release build to render that one
      # version's page (showing just "{version} (current)" + "dev") -- that patch
      # is never committed back to any branch, so it does NOT keep this list here
      # in sync. After every tagged release, manually add a "{version}" entry
      # below (newest first, right after "dev (current)") so the dev docs site's
      # dropdown links to it.
      - text: "Version: dev"
        menu:
          - text: "dev (current)"
            href: https://dremellab.github.io/HAROLD/dev/docs/index.html
          - text: "2.0.0"
            href: https://dremellab.github.io/HAROLD/2.0.0/docs/index.html
          - text: "1.2.1"
            href: https://dremellab.github.io/HAROLD/1.2.1/docs/index.html
      - icon: github
        href: https://github.com/dremellab/HAROLD

  sidebar:
    style: floating
    collapse-level: 2
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - docs/index.md
          - docs/prereq.md
          - docs/usage.md
      - section: "Pipeline"
        contents:
          - docs/pipeline.qmd
          - docs/inputs.md
          - docs/outputs.md
      - section: "Cloud & Storage"
        contents:
          - docs/s3_configuration.md
      - section: "Help"
        contents:
          - docs/help.md

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    smooth-scroll: true
    mermaid:
      theme: default
    mermaid-format: js
    css: styles.css

metadata:
  version: "dev"
